        run: node net/run-party.mjs --chrome 0 --bots 64 --seconds 60 --mg 41
      - name: The fifth wave online (WHACK A MOLE, BALLOON BASH, EGG RAID and BOWLING each forced, 64 AI balls, every hash checked)
        run: |
          node net/run-party.mjs --chrome 0 --bots 64 --seconds 60 --mg 42
          node net/run-party.mjs --chrome 0 --bots 64 --seconds 60 --mg 43
          node net/run-party.mjs --chrome 0 --bots 64 --seconds 60 --mg 44
          node net/run-party.mjs --chrome 0 --bots 64 --seconds 60 --mg 45
