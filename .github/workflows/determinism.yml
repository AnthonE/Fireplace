          node net/run-party.mjs --chrome 0 --bots 64 --seconds 60 --mg 47
          node net/run-party.mjs --chrome 0 --bots 64 --seconds 60 --mg 48
      - name: The seventh wave online (RELAY RACE, RUSH HOUR, LONG JUMP and ROUND UP each forced, 64 AI balls, every hash checked)
