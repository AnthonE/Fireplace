      - name: Crossroads on its own map laid at run time (maps/crossroads, Roblox's, through map_load in the referee and the bot host; its Humanoid's walk, jump and gravity, the map's Crossroads mode; 64 AI fighters, every hash checked)
        run: node net/run-arena.mjs --chrome 0 --bots 64 --seconds 60 --map crossroads
      - name: 'The arena on moving boxes (maps/lifts: lifts up two towers, platforms sliding over a pit; 64 AI fighters, every hash checked)'
