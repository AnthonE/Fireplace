<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fireplace</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #070504; color: #e8d6c0; font: 14px/1.4 ui-monospace, monospace; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: none; }
  #stage canvas.lo { image-rendering: pixelated; }
  #stage canvas.on { display: block; }
  #note { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; }
  #signin { position: fixed; right: 16px; bottom: 16px; display: none; padding: 6px 10px; border: 1px solid #e8d6c0; background: #070504cc; color: #e8d6c0; font: inherit; letter-spacing: 1px; cursor: pointer; }
  #signin.on { display: block; }
  #signin:disabled { cursor: default; opacity: 0.8; }
</style>
<div id="stage">
  <canvas id="room" class="on"></canvas>
  <canvas id="g0" class="lo"></canvas>
  <canvas id="g1" class="lo"></canvas>
  <canvas id="g2"></canvas>
  <canvas id="g3"></canvas>
  <canvas id="g4" class="lo"></canvas>
</div>
<div id="note">lighting the fire…</div>
<button id="signin" type="button">SIGN IN TO BE RATED</button>
<script type="module" src="./fireplace.mjs"></script>
