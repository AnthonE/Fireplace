<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio · minigames</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg: #0b0d14; --panel: #131722; --line: #262c3b; --ink: #cfd3e0; --dim: #7d8499; --hot: #ffcf5a; --bad: #ff7a6b; --ok: #8fd18a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.4 ui-monospace, monospace; overflow: hidden; }
  body { display: grid; grid-template: "top top" auto "edit side" 1fr "foot side" auto / 1fr 420px; }
  header { grid-area: top; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 8px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }
  header b { color: var(--hot); margin-right: 6px; }
  header nav.kit-tabs { display: flex; gap: 2px; margin-right: 4px; }
  header nav.kit-tabs a { color: var(--dim); text-decoration: none; padding: 3px 8px; border: 1px solid transparent; border-radius: 4px; }
  header nav.kit-tabs a:hover { color: var(--ink); border-color: var(--line); }
  header nav.kit-tabs a[aria-current] { color: var(--hot); border-color: var(--hot); background: #3b3220; }
  #edit { grid-area: edit; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  header .grow { flex: 1; }
  button.primary { border-color: var(--hot); color: var(--hot); background: #3b3220; }
  #tabs { display: flex; gap: 3px; padding: 4px 8px 0; align-items: flex-end; }
  #tab-hint { color: var(--dim); padding: 4px 10px 6px; border-top: 1px solid var(--line); font: 12px/1.4 system-ui, sans-serif; }
  #tabs button { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  textarea { flex: 1; width: 100%; resize: none; border: 0; border-top: 1px solid var(--line); padding: 8px 10px; background: #0e1119; color: var(--ink); font: 12.5px/1.45 ui-monospace, monospace; tab-size: 2; white-space: pre; overflow: auto; outline: none; }
  textarea[readonly] { color: var(--dim); }
  aside { grid-area: side; display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--line); background: var(--panel); }
  #panel { overflow-y: auto; padding: 8px 10px 16px; flex: 0 1 auto; max-height: 60%; font: 13px/1.45 system-ui, sans-serif; }
  #panel h2 { margin: 0 0 2px; font-size: 15px; color: var(--ink); }
  ol.steps { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; }
  ol.steps li { display: grid; grid-template-columns: 22px 1fr; gap: 0 8px; align-items: start; }
  ol.steps .mark { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; background: #262c3b; color: var(--ink); margin-top: 1px; }
  ol.steps li.done .mark { background: #1d3a22; color: var(--ok); }
  ol.steps li.fail .mark { background: #3a1d1d; color: var(--bad); }
  ol.steps li.now .mark { background: #3b3220; color: var(--hot); }
  ol.steps b { font-weight: 600; }
  ol.steps .state { color: var(--dim); }
  ol.steps .act { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  details.more { margin-top: 12px; color: var(--dim); }
  details.more summary { cursor: pointer; }
  #play button.big { font-size: 15px; padding: 10px 18px; }
  #play { flex: 1; min-height: 0; border-top: 1px solid var(--line); background: #000; position: relative; }
  #play iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #play p, #play .start { position: absolute; inset: 0; margin: 0; display: grid; place-items: center; align-content: center; gap: 10px; color: var(--dim); text-align: center; padding: 16px; font: 13px/1.45 system-ui, sans-serif; }
  footer { grid-area: foot; padding: 4px 8px; border-top: 1px solid var(--line); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button, select { font: inherit; color: var(--ink); background: #1b2030; border: 1px solid var(--line); border-radius: 4px; padding: 3px 7px; }
  button { cursor: pointer; }
  button:hover { border-color: #3a4258; }
  button:disabled { opacity: .45; cursor: default; }
  button.on { background: #3b3220; border-color: var(--hot); color: var(--hot); }
  h3 { margin: 14px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); }
  h3:first-child { margin-top: 2px; }
  .hint { color: var(--dim); margin: 4px 0; }
  .bad { color: var(--bad); white-space: pre-wrap; word-break: break-word; }
  .ok { color: var(--ok); }
  code { color: var(--hot); user-select: all; word-break: break-all; }
  a { color: var(--hot); }
  @media (max-width: 860px) {
    body { grid-template: "top" auto "edit" 45vh "foot" auto "side" 1fr / 1fr; overflow: auto; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
<script src="../coi.js"></script>
<header>
  <b>Studio</b>
  <nav class="kit-tabs" aria-label="the studio"><a href="map-editor.html">maps</a><a href="studio.html" aria-current="page">minigames</a><a href="look.html">look</a></nav>
  <select id="pick" title="the minigame to work on" aria-label="the minigame to work on"></select>
  <button id="play-btn" class="primary" title="build it and play it against AI balls (Ctrl+Enter builds)">▶ play</button>
  <span class="grow"></span>
  <button id="send" title="download the changed files and open GitHub's upload page">send it in</button>
</header>
<div id="edit">
  <div id="tabs"><button id="tab-consts" class="on">the numbers</button><button id="tab-wat">the code</button></div>
  <div id="tab-hint"></div>
  <textarea id="text" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
</div>
<aside>
  <div id="panel"></div>
  <div id="play"></div>
</aside>
<footer id="foot">loading…</footer>
<script type="module" src="./studio.mjs"></script>
