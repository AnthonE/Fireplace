<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio · maps</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg: #0b0d14; --panel: #131722; --line: #262c3b; --ink: #cfd3e0; --dim: #7d8499; --hot: #ffcf5a; --bad: #ff7a6b; --ok: #8fd18a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.4 ui-monospace, monospace; overflow: hidden; }
  body { display: grid; grid-template: "top top" auto "map side" 1fr "foot side" auto / 1fr 340px; }
  header { grid-area: top; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 8px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }
  header b { color: var(--hot); margin-right: 6px; }
  header nav.kit-tabs { display: flex; gap: 2px; margin-right: 4px; }
  header nav.kit-tabs a { color: var(--dim); text-decoration: none; padding: 3px 8px; border: 1px solid transparent; border-radius: 4px; }
  header nav.kit-tabs a:hover { color: var(--ink); border-color: var(--line); }
  header nav.kit-tabs a[aria-current] { color: var(--hot); border-color: var(--hot); background: #3b3220; }
  #wrap { grid-area: map; position: relative; min-width: 0; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #wrap.m2d #view3d, #wrap.m2d #over3d, #wrap.m3d #view { display: none; }
  #wrap.split #view { width: 50%; }
  #wrap.split #view3d, #wrap.split #over3d { left: 50%; width: 50%; border-left: 1px solid var(--line); }
  #over3d { pointer-events: none; }
  #modes { display: flex; gap: 0; }
  #modes button { border-radius: 0; }
  #modes button:first-child { border-radius: 4px 0 0 4px; }
  #modes button:last-child { border-radius: 0 4px 4px 0; }
  aside { grid-area: side; overflow-y: auto; border-left: 1px solid var(--line); background: var(--panel); padding: 8px 10px 24px; }
  footer { grid-area: foot; padding: 4px 8px; border-top: 1px solid var(--line); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button, select, input { font: inherit; color: var(--ink); background: #1b2030; border: 1px solid var(--line); border-radius: 4px; padding: 3px 7px; }
  button { cursor: pointer; }
  button:hover { border-color: #3a4258; }
  button.on { background: #3b3220; border-color: var(--hot); color: var(--hot); }
  input[type=number] { width: 74px; }
  input[type=text] { width: 100%; }
  input[type=range] { width: 90px; padding: 0; vertical-align: middle; }
  h3 { margin: 14px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); }
  h3:first-child { margin-top: 2px; }
  .row { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; margin: 4px 0; }
  .row > label, .row > span > label { color: var(--dim); }
  .row > label { min-width: 40px; }
  .hint { color: var(--dim); margin: 4px 0; }
  .bad { color: var(--bad); white-space: pre-wrap; }
  .ok { color: var(--ok); }
  code { color: var(--hot); user-select: all; word-break: break-all; }
  .tools { display: flex; flex-wrap: wrap; gap: 3px; }
  header .grow { flex: 1; }
  header .break { flex-basis: 100%; height: 0; }
  button.primary { border-color: var(--hot); color: var(--hot); background: #3b3220; }
  button:disabled { opacity: .45; cursor: default; }
  .pill { padding: 2px 9px; border-radius: 10px; border: 1px solid var(--line); color: var(--dim); cursor: pointer; white-space: nowrap; }
  .pill.ok { color: var(--ok); border-color: #2f5a33; background: #16261a; }
  .pill.bad { color: var(--bad); border-color: #5a2f2f; background: #2a1616; }
  aside { font: 13px/1.45 system-ui, sans-serif; }
  aside code, aside input, aside select, aside button { font-family: ui-monospace, monospace; }
  ol.steps { list-style: none; margin: 2px 0 10px; padding: 8px 10px; display: grid; gap: 4px; background: #0e1119; border: 1px solid var(--line); border-radius: 6px; counter-reset: s; color: var(--dim); }
  ol.steps li { counter-increment: s; }
  ol.steps li::before { content: counter(s); display: inline-grid; place-items: center; width: 16px; height: 16px; margin-right: 6px; border-radius: 50%; background: #262c3b; color: var(--ink); font-size: 10px; }
  ol.steps b { color: var(--ink); font-weight: 600; }
  ul.facts { margin: 4px 0; padding-left: 18px; color: var(--dim); }
  ul.facts li { margin: 1px 0; }
  ul.course { list-style: none; margin: 4px 0; padding: 0; }
  ul.course li { margin: 2px 0; padding-left: 16px; position: relative; color: var(--dim); }
  ul.course li::before { content: "✓"; position: absolute; left: 0; color: var(--ok); }
  ul.course li.warn { color: var(--hot); }
  ul.course li.warn::before { content: "!"; color: var(--hot); }
  ul.course li.bad { color: var(--bad); }
  ul.course li.bad::before { content: "✗"; color: var(--bad); }
  ul.course li.go { cursor: pointer; }
  ul.course li.go:hover { color: var(--ink); }
  .dirs button { padding: 2px 6px; }
  @media (max-width: 760px) {
    body { grid-template: "top" auto "map" 1fr "foot" auto "side" 40vh / minmax(0, 1fr); }
    header .grow, header .sep { display: none; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
<header>
  <b>Studio</b>
  <nav class="kit-tabs" aria-label="the studio"><a href="map-editor.html" aria-current="page">maps</a><a href="studio.html">minigames</a><a href="look.html">look</a></nav>
  <select id="open" title="open a map">
    <option value="">open…</option>
    <option value="canyon">Box Canyon</option>
    <option value="skyways">Skyways</option>
    <option value="crossroads">Crossroads (from Roblox)</option>
    <option value="obby">Sky Steps (an obby)</option>
    <option value="new">a new map</option>
    <option value="new-obby">a new obby</option>
    <option value="folder">a folder…</option>
    <option value="roblox">a Roblox place…</option>
    <option value="vox">a MagicaVoxel model…</option>
  </select>
  <button id="save" title="write map.json, height.png and surface.png (Ctrl+S)">save</button>
  <span id="modes" title="the map from above, as the game draws it, or both"><button data-mode="2d">2D</button><button data-mode="3d">3D</button><button data-mode="split">both</button></span>
  <span class="grow"></span>
  <span id="ready" class="pill" role="status" title="whether the game can build this map; click for the details">checking…</span>
  <button id="play-top" class="primary" title="the arena on this map, you and AI fighters, in a new tab">▶ play it</button>
  <button id="send-top" title="download the map's files and open GitHub's upload page">send it in</button>
  <span class="break"></span>
  <span class="tools" id="tools" aria-label="tools"></span>
  <span class="sep"></span>
  <span id="brush">
    <label>size <input id="radius" type="range" min="2" max="60" value="12"></label>
    <label>strength <input id="strength" type="range" min="1" max="100" value="30"></label>
    <select id="surface"></select>
  </span>
  <span id="placing">
    <select id="material" title="a new box's material"></select>
    <select id="weapon" title="a new pad's weapon"></select>
  </span>
  <span class="sep"></span>
  <label title="the grid everything placed, moved and sized lands on, in both views">snap <select id="snap"><option value="0">off</option><option>0.1</option><option selected>0.25</option><option>0.5</option><option>1</option><option>2</option></select> m</label>
  <label title="a drag moves the picked box's whole structure, and Ctrl+D copies it whole; Alt does the other for one drag"><input id="whole" type="checkbox"> whole structure</label>
  <button id="undo" title="Ctrl+Z">undo</button>
  <button id="redo" title="Ctrl+Shift+Z">redo</button>
</header>
<div id="wrap"><canvas id="view"></canvas><canvas id="view3d"></canvas><canvas id="over3d"></canvas></div>
<aside id="side"></aside>
<footer id="foot">loading…</footer>
<script type="module" src="./map-editor.mjs"></script>
